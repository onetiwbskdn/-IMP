*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,sans-serif}
body{background:linear-gradient(180deg,#0a0e1a,#0f1524);color:#e0e6f0;min-height:100vh;padding:8px}
h1,h2,h3,h4{font-weight:600}
.hidden{display:none!important}
button{background:#1f2a44;color:#e0e6f0;border:1px solid #2f3a5a;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:.15s}
button:hover{background:#2a3a5a;border-color:#4a6af0}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{background:#0f1524;color:#e0e6f0;border:1px solid #2f3a5a;padding:6px 10px;border-radius:6px;font-size:13px}
input:focus,select:focus{outline:none;border-color:#4a6af0}
.fi{border-radius:2px;vertical-align:middle;margin-right:4px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.flag-inline{font-size:15px}
.flag-btn{font-size:22px;margin-right:0}
.flag-pick{font-size:24px;margin:0;cursor:pointer}
.flag-big{font-size:28px;margin-right:0}
.flag-xl{font-size:40px;margin-right:0}
.topbar{background:#131a2e;border:1px solid #2a3550;border-radius:10px;padding:12px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.stat{font-size:13px}.stat b{color:#7ec8ff}
.stat.red b{color:#ff6b6b}.stat.green b{color:#6bff8b}.stat.sick b{color:#ff5577}
.stat.season b{color:#ffb86b}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tab{background:#131a2e;border:1px solid #2a3550;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:13px}
.tab.active{background:#4a6af0;border-color:#4a6af0;color:#fff}
.content{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:#131a2e;border:1px solid #2a3550;border-radius:10px;padding:12px}
.card h3,.card h4{margin-bottom:8px;color:#7ec8ff;font-size:15px}
.item{background:#0f1524;border:1px solid #2a3550;border-radius:8px;padding:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.item .name{flex:1}.item .cost{color:#ffb86b;font-size:11px}
.item button{padding:4px 10px;font-size:12px}
.log{max-height:300px;overflow-y:auto;font-size:12px;background:#0a0e1a;border-radius:6px;padding:8px}
.log div{padding:3px 0;border-bottom:1px solid #1a2030;color:#a0b0c0}
.log .disaster{color:#ff5577;font-weight:600}
.log .good{color:#6bff8b;font-weight:600}
.chat{max-height:150px;overflow-y:auto;background:#0a0e1a;border-radius:6px;padding:8px;font-size:12px;margin-bottom:6px}
.highlight{color:#7ec8ff;font-weight:600}
.player-row{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #1a2030;font-size:12px;flex-wrap:wrap}
.center{text-align:center}
#startScreen{max-width:560px;margin:20px auto;text-align:center;background:#131a2e;border:1px solid #2a3550;border-radius:14px;padding:24px}
#startScreen input,#startScreen select{width:100%;margin:6px 0;padding:10px}
#startScreen button{width:100%;padding:12px;margin-top:10px;font-size:15px;background:#4a6af0;border-color:#4a6af0}
#flagPicker{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0;max-height:200px;overflow-y:auto;padding:6px;background:#0a0e1a;border-radius:8px}
.flag-cell{padding:6px;background:#0f1524;border:2px solid transparent;border-radius:6px;text-align:center;transition:.15s}
.flag-cell:hover{background:#1f2a44}
.flag-cell.selected{border-color:#4a6af0;background:#1f2a44}
.empty{color:#607090;font-style:italic;font-size:12px}
.tip{font-size:11px;color:#607090;margin-top:4px}
.sick-badge{background:#5a1a2a;border:1px solid #ff5577;color:#ff8899;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:4px}
.warn{background:#3a1a1a;border:1px solid #ff5577;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px}
.countdown{color:#ffb86b;font-size:12px}
.ach{background:#0f1524;border:1px solid #2a3550;border-radius:8px;padding:10px;font-size:12px;margin-bottom:6px}
.ach.done{border-color:#6bff8b;background:#0f2a1a}
.ach .name{font-weight:600;color:#7ec8ff;margin-bottom:4px}
.ach.done .name{color:#6bff8b}
.bonus-tag{display:inline-block;background:#1f3a2a;color:#6bff8b;padding:2px 6px;border-radius:4px;font-size:11px;margin-left:4px}

</div>

function initFlagPicker(){

  picker.innerHTML = AI_COUNTRIES.map(c=>`
    <div class="flag-cell ${c.flag===selectedFlag?'selected':''}" data-flag="${c.flag}" data-name="${c.name}" onclick="pickFlag('${c.flag}','${c.name}')">
      <span class="fi fi-${c.flag} flag-pick"></span>

function pickFlag(flag, name){
  selectedFlag = flag;
  selectedName = name;
  document.getElementById('cName').value = name;
  document.querySelectorAll('.flag-cell').forEach(el=>{
    el.classList.toggle('selected', el.dataset.flag === flag);
  });
}

function newState(cfg){
  // Исключаем выбранную страну из ИИ-списка
  const filteredCountries = AI_COUNTRIES.filter(c => c.flag !== cfg.flag);
  
  // Стартовые отношения по парам
  const RELATIONS = {
    'США-Великобритания': 70, 'США-Канада': 70, 'Россия-Беларусь': 65,
    'Германия-Франция': 60, 'Китай-Пакистан': 60, 'Китай-Россия': 50,
    'Индия-Россия': 45, 'Южная Корея-Япония': 40, 'Бразилия-Аргентина': 35,
    'США-Китай': -40, 'США-Россия': -45, 'США-Северная Корея': -70,
    'Южная Корея-Северная Корея': -60, 'Индия-Пакистан': -55,
    'Израиль-Иран': -75, 'Саудовская Арабия-Иран': -40,
    'Россия-Украина': -50
  };
  
  function getRel(a, b){
    return RELATIONS[`${a}-${b}`] ?? RELATIONS[`${b}-${a}`] ?? Math.floor(Math.random()*60)-30;
  }
  
  const playerData = AI_COUNTRIES.find(c => c.flag === cfg.flag);
  
  const ais = filteredCountries.map((c,i)=>({
    id:'ai'+i, name:c.name, flag:c.flag, region:c.region,
    strength: c.power + Math.floor(Math.random()*100),
    attitude: getRel(cfg.name, c.name),
    atWar:false, ally:false, defeated:false,
    resources: 5000 + c.power * 20,
    activeDiseases: [],
    bonus: c.bonus
  }));
  
  return {
    country: {...cfg, bonus: playerData?.bonus || {}},
    day: 1,
    tab: 'overview',
    res: {money:5000, food:2000, steel:500, oil:300, uranium:100},
    pop: 100, popCap: 100, happiness: 70,
    buildings: {}, army: {}, techs: [],
    activeDiseases: [],
    diseasesSurvived: 0,
    achievements: [],
    role: 'president',
    ai: ais,
    log: ['👑 Правление началось!'],
    worldNews: [],
    online: {peer:null, conns:[], roomCode:null, players:{}, chat:[]},
    lastEvent: 0,
    globalEventCount: 0
  };
}

function startGame(){
  const name = document.getElementById('cName').value.trim() || selectedName;
  const ideo = document.getElementById('cIdeo').value;
  state = newState({name, flag: selectedFlag, ideo});
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  render();
  setInterval(tick, 8000);
  setInterval(save, 10000);
  startGlobalEventTimer();
}

function loadGame(){
  const raw = localStorage.getItem('imperia_save');
  if(!raw){alert('Сохранений нет');return;}
  try{
    state = JSON.parse(raw);
    state.online = {peer:null,conns:[],roomCode:null,players:{},chat:[]};
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('game').classList.remove('hidden');
    render();
    setInterval(tick, 8000);
    setInterval(save, 10000);
    startGlobalEventTimer();
  }catch(e){alert('Ошибка загрузки');}
}

function save(){
  if(!state)return;
  const s = JSON.parse(JSON.stringify(state));
  s.online = {peer:null,conns:[],roomCode:null,players:{},chat:[]};
  localStorage.setItem('imperia_save', JSON.stringify(s));
}

/* ============ ГЛОБАЛЬНЫЕ СОБЫТИЯ КАЖДЫЕ 10 МИН ============ */
function startGlobalEventTimer(){
  nextGlobalEventTime = Date.now() + 600000;
  if(globalEventTimer) clearInterval(globalEventTimer);
  globalEventTimer = setInterval(()=>{
    triggerGlobalEvent();
    nextGlobalEventTime = Date.now() + 600000;
    render();
  }, 600000);
  setInterval(()=>{
    const el = document.getElementById('countdownEl');
    if(el){
      const left = Math.max(0, nextGlobalEventTime - Date.now());
      const m = Math.floor(left/60000);
      const s = Math.floor((left%60000)/1000);
      el.textContent = `${m}:${s.toString().padStart(2,'0')}`;
    }
  }, 1000);
}

function triggerGlobalEvent(){
  if(!state) return;
  state.globalEventCount++;
  const isDisease = Math.random() < 0.65;
  
  if(isDisease){
    const aliveAi = state.ai.filter(a=>!a.defeated);
    const targets = [...aliveAi.map(a=>({type:'ai', ai:a})), {type:'player'}];
    const target = targets[Math.floor(Math.random()*targets.length)];
    const disease = DISEASES[Math.floor(Math.random()*DISEASES.length)];
    applyDisease(target, disease, true);
  } else {
    const ev = GLOBAL_EVENTS[Math.floor(Math.random()*GLOBAL_EVENTS.length)];
    const aliveAi = state.ai.filter(a=>!a.defeated);
    const targets = [...aliveAi.map(a=>({type:'ai', ai:a})), {type:'player'}];
    const target = targets[Math.floor(Math.random()*targets.length)];
    
    if(target.type==='player'){
      ev.f({isPlayer:true, s:state});
      addWorldNews(`${ev.name} — ${state.country.flag} ${state.country.name}`, 'disaster');
    } else {
      ev.f({isPlayer:false, ai:target.ai});
      addWorldNews(`${ev.name} — ${target.ai.flag} ${target.ai.name}`, 'disaster');
    }
  }
}

function applyDisease(target, disease, broadcast){
  const inst = {...disease, remaining: disease.duration};
  
  if(target.type === 'player'){
    if(state.activeDiseases.some(d=>d.name===disease.name)) return;
    let reduction = 1;
    if(state.techs.includes('vaccine')) reduction *= 0.5;
    if(state.techs.includes('epidemiology')) reduction *= 0.6;
    inst.popLoss *= reduction;
    inst.happiness *= reduction;
    inst.remaining = Math.ceil(inst.remaining * reduction);
    state.activeDiseases.push(inst);
    log(`🦠 ВСПЫШКА ${disease.name}!`, 'disaster');
    addWorldNews(`🦠 ${disease.name} — ${state.country.name}`, 'disaster');
  } else {
    const ai = target.ai;
    if(ai.activeDiseases.some(d=>d.name===disease.name)) return;
    ai.activeDiseases.push(inst);
    addWorldNews(`🦠 ${disease.name} — ${ai.name}`, 'disaster');
  }
  
  if(broadcast && state.online.peer){
    broadcastGlobalEvent({type:'disease', diseaseName:disease.name, targetId: target.type==='ai'?target.ai.id:'player', targetType:target.type});
  }
}

function addWorldNews(text, cls=''){
  if(!state.worldNews) state.worldNews = [];
  state.worldNews.unshift({text, cls, day:state.day, time:new Date().toLocaleTimeString('ru')});
  if(state.worldNews.length > 100) state.worldNews.pop();
}

/* ============ СИМУЛЯЦИЯ ============ */
function calcPopCap(){
  let cap = 50;
  for(const [id,c] of Object.entries(state.buildings)){
    const b = B.find(x=>x.id===id);
    if(b && b.e.popCap) cap += b.e.popCap * c;
  }
  return cap;
}

function armyPower(){
  let p = 0;
  for(const [id,c] of Object.entries(state.army)){
    const u = U.find(x=>x.id===id);
    if(u) p += u.power * c;
  }
  p *= 1 + state.techs.length * 0.05;
  return Math.floor(p);
}

function currentSeason(){
  const idx = Math.floor((state.day % 40) / 10);
  return SEASONS[idx];
}

function tick(){
  if(!state)return;
  state.day++;
  state.popCap = calcPopCap();
  const season = currentSeason();
  const bonus = state.country.bonus || {};
  
  // Производство с бонусами и сезоном
  let inc = {money:0, food:0, steel:0, oil:0, uranium:0};
  let happinessMod = 0;
  for(const [id,c] of Object.entries(state.buildings)){
    const b = B.find(x=>x.id===id);
    if(!b) continue;
    for(const [k,v] of Object.entries(b.e)){
      if(k==='popCap') continue;
      if(k==='happiness'){happinessMod += v*c;}
      else inc[k] = (inc[k]||0) + v*c;
    }
  }
  
  // Применяем бонусы страны
  if(bonus.money) inc.money *= (1 + bonus.money);
  if(bonus.food) inc.food *= (1 + bonus.food);
  if(bonus.steel) inc.steel *= (1 + bonus.steel);
  if(bonus.oil) inc.oil *= (1 + bonus.oil);
  
  // Сезон влияет на еду
  inc.food *= season.food;
  
  // Налоги
  inc.money += Math.floor(state.pop * 2 * (state.happiness/100));
  
  // Upkeep армии
  let upkeep = 0;
  for(const [id,c] of Object.entries(state.army)){
    const u = U.find(x=>x.id===id);
    if(u) upkeep += u.upkeep * c;
  }
  
  const roleMult = state.role==='president'?1: state.role==='minister'?0.7: state.role==='rebel'?0.3: 0.5;
  inc.money = Math.floor(inc.money * roleMult);
  
  state.res.money = Math.max(0, state.res.money + inc.money - upkeep);
  state.res.food = Math.max(0, state.res.food + Math.floor(inc.food));
  state.res.steel += Math.floor(inc.steel);
  state.res.oil += Math.floor(inc.oil);
  state.res.uranium += Math.floor(inc.uranium);
  
  // Голод
  const foodNeed = Math.floor(state.pop * 0.5);
  if(state.res.food < foodNeed){
    state.res.food = 0;
    state.happiness = Math.max(0, state.happiness - 5);
    state.pop = Math.floor(state.pop * 0.95);
    if(state.day % 5 === 0) log('⚠️ Голод!', 'disaster');
  } else {
    state.res.food -= foodNeed;
  }
  
  // Рост с бонусом и сезоном
  const growthBonus = (bonus.popGrowth || 0);
  if(state.pop < state.popCap && state.happiness > 40){
    const baseGrowth = Math.floor(state.pop*0.02);
    const totalGrowth = Math.floor(baseGrowth * season.growth * (1 + growthBonus));
    state.pop = Math.min(state.popCap, state.pop + Math.max(1, totalGrowth));
  }
  
  // Счастье
  const baseHap = 50 + happinessMod + (bonus.happiness || 0);
  if(state.happiness < baseHap) state.happiness = Math.min(baseHap, state.happiness + 1);
  else if(state.happiness > baseHap) state.happiness = Math.max(baseHap, state.happiness - 1);
  state.happiness = Math.max(0, Math.min(100, state.happiness));
  
  // Болезни
  applyDiseasesTick();
  
  // Войны
  const activeWars = state.ai.filter(a=>a.atWar && !a.defeated).slice(0, 5);
  for(const ai of activeWars){
    const myPow = armyPower();
    if(Math.random() < 0.5){
      ai.strength = Math.max(0, ai.strength - myPow*0.1);
      loseRandomUnits(0.02);
      if(ai.strength <= 0){
        ai.defeated = true; ai.atWar = false;
        state.res.money += ai.resources;
        state.res.steel += 2000;
        log(`🏆 Победа над ${ai.name}! +${ai.resources}💰`, 'good');
        addWorldNews(`🏆 ${state.country.name} победила ${ai.name}`, 'good');
      }
    } else {
      loseRandomUnits(0.03);
      state.happiness = Math.max(0, state.happiness - 2);
    }
  }
  
  // ИИ-войны
  for(let i=0; i<2; i++){
    const alive = state.ai.filter(a=>!a.defeated && a.strength > 0);
    if(alive.length < 2) break;
    const a = alive[Math.floor(Math.random()*alive.length)];
    const b = alive[Math.floor(Math.random()*alive.length)];
    if(a===b) continue;
    const dmg = Math.floor(Math.random() * 60);
    if(a.strength > b.strength){
      b.strength = Math.max(0, b.strength - dmg);
      if(b.strength === 0){ b.defeated = true; addWorldNews(`💀 ${a.name} уничтожила ${b.name}`, 'disaster'); }
    } else {
      a.strength = Math.max(0, a.strength - dmg);
      if(a.strength === 0){ a.defeated = true; addWorldNews(`💀 ${b.name} уничтожила ${a.name}`, 'disaster'); }
    }
  }
  
  // События
  if(state.day - state.lastEvent > 10 && Math.random() < 0.25){
    state.lastEvent = state.day;
    randomEvent();
  }
  
  // Достижения
  checkAchievements();
  
  save();
  render();
}

function applyDiseasesTick(){
  for(let i=state.activeDiseases.length-1; i>=0; i--){
    const d = state.activeDiseases[i];
    state.pop = Math.floor(state.pop * (1 - d.popLoss/10));
    state.happiness = Math.max(0, state.happiness + Math.floor(d.happiness/10));
    d.remaining--;
    if(d.remaining <= 0){
      log(`✅ Болезнь ${d.name} отступила!`, 'good');
      state.diseasesSurvived = (state.diseasesSurvived||0) + 1;
      state.activeDiseases.splice(i, 1);
    }
  }
  
  for(const ai of state.ai){
    if(!ai.activeDiseases) ai.activeDiseases = [];
    for(let i=ai.activeDiseases.length-1; i>=0; i--){
      const d = ai.activeDiseases[i];
      ai.strength = Math.max(0, ai.strength - Math.floor(d.popLoss * 100));
      d.remaining--;
      if(d.remaining <= 0) ai.activeDiseases.splice(i, 1);
    }
  }
  
  // Заражение
  for(const ai of state.ai){
    if(!ai.activeDiseases || ai.activeDiseases.length === 0) continue;
    const spreading = ai.activeDiseases.find(d=>d.contagion > 0 && Math.random() < d.contagion * 0.08);
    if(spreading){
      if(Math.random() < 0.15){
        if(!state.activeDiseases.some(d=>d.name===spreading.name)){
          const newDisease = DISEASES.find(d=>d.name===spreading.name);
          if(newDisease){
            state.activeDiseases.push({...newDisease, remaining:newDisease.duration});
            log(`🦠 ${spreading.name} из ${ai.name}!`, 'disaster');
            addWorldNews(`🦠 ${spreading.name}: ${ai.name} → ${state.country.name}`, 'disaster');
          }
        }
      } else {
        const others = state.ai.filter(a=>!a.defeated && a.id !== ai.id && (!a.activeDiseases || !a.activeDiseases.some(d=>d.name===spreading.name)));
        if(others.length > 0){
          const victim = others[Math.floor(Math.random()*others.length)];
          if(!victim.activeDiseases) victim.activeDiseases = [];
          const newDisease = DISEASES.find(d=>d.name===spreading.name);
          if(newDisease){
            victim.activeDiseases.push({...newDisease, remaining:newDisease.duration});
            addWorldNews(`🦠 ${spreading.name}: ${ai.name} → ${victim.name}`, 'disaster');
          }
        }
      }
    }
  }
}

function loseRandomUnits(frac){
  for(const [id,c] of Object.entries(state.army)){
    const loss = Math.max(0, Math.floor(c*frac));
    state.army[id] = c - loss;
    if(state.army[id]<=0) delete state.army[id];
  }
}

function checkAchievements(){
  ACHIEVEMENTS.forEach(a=>{
    if(!state.achievements.includes(a.id) && a.check(state)){
      state.achievements.push(a.id);
      log(`🏆 Достижение: ${a.n}`, 'good');
    }
  });
}

const LOCAL_EVENTS = [
  {t:'📈 Экономический бум!', f:s=>{s.res.money+=3000;}},
  {t:'📉 Рецессия', f:s=>{s.res.money=Math.max(0,s.res.money-2000);s.happiness-=5;}},
  {t:'🎉 Национальный праздник', f:s=>{s.happiness=Math.min(100,s.happiness+10);}},
  {t:'🌾 Богатый урожай', f:s=>{s.res.food+=1500;}},
  {t:'💰 Иностранные инвестиции', f:s=>{s.res.money+=5000;}},
  {t:'🎓 Научный прорыв', f:s=>{s.res.money+=1000;}},
  {t:'🔥 Протесты', f:s=>{s.happiness-=10;}}
];

function randomEvent(){
  const ev = LOCAL_EVENTS[Math.floor(Math.random()*LOCAL_EVENTS.length)];
  ev.f(state);
  log('🎲 ' + ev.t);
}

function log(msg, cls=''){
  if(!state)return;
  state.log.unshift(`[День ${state.day}] ${msg}${cls?'||'+cls:''}`);
  if(state.log.length>150) state.log.pop();
}

/* ============ ДЕЙСТВИЯ ============ */
function build(id){
  const b = B.find(x=>x.id===id);
  if(!b)return;
  if(state.res.money < b.c){log('❌ Не хватает денег');return;}
  if(state.res.steel < (b.s||0)){log('❌ Не хватает стали');return;}
  state.res.money -= b.c;
  state.res.steel -= (b.s||0);
  state.buildings[id] = (state.buildings[id]||0)+1;
  state.popCap = calcPopCap();
  log(`🏗️ Построено: ${b.n}`);
  render();
}

function recruit(id){
  const u = U.find(x=>x.id===id);
  if(!u)return;
  const bonus = state.country.bonus || {};
  const armyDiscount = bonus.army || 0;
  const finalCost = Math.floor(u.c * (1 - armyDiscount));
  const finalSteel = Math.floor(u.s * (1 - armyDiscount));
  
  if(state.res.money < finalCost){log('❌ Не хватает денег');return;}
  if(state.res.steel < finalSteel){log('❌ Не хватает стали');return;}
  state.res.money -= finalCost;
  state.res.steel -= finalSteel;
  state.army[id] = (state.army[id]||0)+1;
  log(`⚔️ Завербовано: ${u.n}`);
  render();
}

function research(id){
  const t = T.find(x=>x.id===id);
  if(!t || state.techs.includes(id))return;
  const bonus = state.country.bonus || {};
  const discount = bonus.tech || 0;
  const finalCost = Math.floor(t.c * (1 - discount));
  
  if(state.res.money < finalCost){log('❌ Не хватает денег');return;}
  state.res.money -= finalCost;
  state.techs.push(id);
  log(`🔬 Исследовано: ${t.n}`, 'good');
  render();
}

function declareWar(aiId){
  const ai = state.ai.find(a=>a.id===aiId);
  if(!ai||ai.defeated)return;
  ai.atWar = true; ai.ally = false; ai.attitude = -100;
  log(`⚔️ Война: ${ai.name}`, 'disaster');
  addWorldNews(`⚔️ ${state.country.name} → ${ai.name}: война`, 'disaster');
  render();
}

function makeAlliance(aiId){
  const ai = state.ai.find(a=>a.id===aiId);
  if(!ai||ai.defeated)return;
  if(ai.attitude < 20){log('❌ Слишком низкое отношение');return;}
  ai.ally = true; ai.atWar = false;
  log(`🤝 Союз с ${ai.name}`, 'good');
  render();
}

function makePeace(aiId){
  const ai = state.ai.find(a=>a.id===aiId);
  if(!ai)return;
  ai.atWar = false; ai.attitude += 20;
  log(`🕊️ Мир с ${ai.name}`);
  render();
}

function sendTrade(aiId){
  const ai = state.ai.find(a=>a.id===aiId);
  if(!ai)return;
  if(state.res.money < 1000){log('❌ Недостаточно денег');return;}
  state.res.money -= 1000;
  state.res.food += 500;
  state.res.steel += 200;
  ai.attitude += 5;
  log(`💱 Торговля с ${ai.name}`);
  render();
}

function becomeRole(role){
  state.role = role;
  log(`👤 Роль: ${role}`);
  render();
}

function quarantine(){
  if(state.activeDiseases.length === 0){log('❌ Вы не болеете');return;}
  const cost = 3000 * state.activeDiseases.length;
  if(state.res.money < cost){log(`❌ Нужно ${cost}💰`);return;}
  state.res.money -= cost;
  const cleared = state.activeDiseases.length;
  state.activeDiseases = [];
  state.diseasesSurvived = (state.diseasesSurvived||0) + cleared;
  log(`🚧 Карантин: остановлено ${cleared}`, 'good');
  render();
}

/* ============ СЕТЬ ============ */
function broadcastGlobalEvent(ev){
  const o = state.online;
  if(!o.peer) return;
  o.conns.forEach(c=>{
    if(c.open) c.send({t:'global_event', ...ev, fromName: state.country.name});
  });
}

function createRoom(){
  const code = Math.random().toString(36).substring(2,8).toUpperCase();
  try{
    const peer = new Peer('imperia-'+code, PEER_CONFIG);
    peer.on('open', ()=>{
      state.online.peer = peer;
      state.online.roomCode = code;
      log(`🌐 Комната: ${code}`);
      render();
    });
    peer.on('connection', conn=>{
      conn.on('open', ()=>{
        state.online.conns.push(conn);
        conn.send({t:'hello', name: state.country.name, flag: state.country.flag});
      });
      conn.on('data', d=>handleNet(d, conn));
      conn.on('close', ()=>{
        delete state.online.players[conn.peer];
        render();
      });
    });
    peer.on('error', e=>{
      alert('Ошибка сети: '+e.type);
      state.online.peer=null; state.online.roomCode=null;
      render();
    });
  }catch(e){alert('Ошибка');}
}

function joinRoom(code){
  if(!code){alert('Введите код');return;}
  try{
    const peer = new Peer(PEER_CONFIG);
    peer.on('open', ()=>{
      const conn = peer.connect('imperia-'+code.toUpperCase(), {reliable:true});
      conn.on('open', ()=>{
        state.online.peer = peer;
        state.online.joinedCode = code.toUpperCase();
        state.online.conns.push(conn);
        conn.send({t:'hello', name: state.country.name, flag: state.country.flag});
        log('🌐 Подключено к '+code);
        render();
      });
      conn.on('data', d=>handleNet(d, conn));
      conn.on('close', ()=>{
        delete state.online.players[conn.peer];
        render();
      });
    });
    peer.on('error', e=>{
      alert('Ошибка: '+e.type);
      state.online.peer = null;
      render();
    });
  }catch(e){alert('Ошибка');}
}

function handleNet(d, conn){
  const o = state.online;
  if(d.t==='hello'){
    o.players[conn.peer] = {name:d.name, flag:d.flag};
    o.chat.push({from:'система', text:`${d.name} подключился`});
    log(`👋 ${d.name} в игре`);
    render();
  }
  else if(d.t==='chat'){ o.chat.push({from:d.name, text:d.text}); render(); }
  else if(d.t==='war'){
    log(`⚔️ ${d.name} объявил войну!`, 'disaster');
    addWorldNews(`⚔️ ${d.name} → ${state.country.name}: война`, 'disaster');
    render();
  }
  else if(d.t==='ally'){
    if(confirm(`${d.name} предлагает союз. Принять?`)){
      conn.send({t:'ally_accept', name: state.country.name});
      o.chat.push({from:'система', text:`Союз с ${d.name}`});
    } else conn.send({t:'ally_decline', name: state.country.name});
    render();
  }
  else if(d.t==='ally_accept'){
    log(`🤝 ${d.name} принял союз!`, 'good');
    o.chat.push({from:'система', text:`${d.name} принял союз`});
    render();
  }
  else if(d.t==='ally_decline'){ log(`❌ ${d.name} отклонил союз`); render(); }
  else if(d.t==='peace'){
    log(`🕊️ ${d.name} предлагает мир`);
    o.chat.push({from:'система', text:`${d.name} предлагает мир`});
    render();
  }
  else if(d.t==='trade_offer'){
    if(confirm(`${d.name} предлагает торговлю?`)){
      state.res.money += 500; state.res.steel += 200;
      conn.send({t:'trade_ok', name: state.country.name});
    }
    render();
  }
  else if(d.t==='trade_ok'){ log(`💱 Торговля с ${d.name}`, 'good'); render(); }
  else if(d.t==='global_event'){
    if(d.type === 'disease'){
      const disease = DISEASES.find(x=>x.name === d.diseaseName);
      if(disease){
        if(d.targetType === 'player'){
          if(!state.activeDiseases.some(x=>x.name===disease.name)){
            state.activeDiseases.push({...disease, remaining: disease.duration});
            log(`🦠 ${d.fromName} принёс ${disease.name}!`, 'disaster');
          }
        } else {
          const ai = state.ai.find(a=>a.id === d.targetId);
          if(ai && !ai.activeDiseases.some(x=>x.name===disease.name)){
            ai.activeDiseases.push({...disease, remaining: disease.duration});
          }
        }
        addWorldNews(`🦠 ${disease.name} — ${d.fromName} (сеть)`, 'disaster');
        render();
      }
    }
  }
}

function netAction(peerId, action){
  const conn = state.online.conns.find(c=>c.peer===peerId);
  if(!conn){alert('Соединение потеряно');return;}
  const p = state.online.players[peerId];
  if(action==='war'){
    if(!confirm(`Объявить войну ${p.name}?`))return;
    conn.send({t:'war', name: state.country.name});
  }
  else if(action==='ally') conn.send({t:'ally', name: state.country.name});
  else if(action==='peace') conn.send({t:'peace', name: state.country.name});
  else if(action==='trade') conn.send({t:'trade_offer', name: state.country.name});
  render();
}

function sendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text)return;
  state.online.conns.forEach(c=>{
    if(c.open) c.send({t:'chat', name: state.country.name, text});
  });
  state.online.chat.push({from:'вы', text});
  input.value='';
  render();
}

function disconnectOnline(){
  if(state.online.peer) state.online.peer.destroy();
  state.online = {peer:null,conns:[],roomCode:null,players:{},chat:[]};
  log('❌ Отключено');
  render();
}

window.addEventListener('beforeunload', save);

/* Инициализация */
initFlagPicker();
document.getElementById('cName').value = 'Россия';
</script>
